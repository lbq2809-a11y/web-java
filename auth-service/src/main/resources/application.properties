# Cấu hình Auth Service (Cổng 8082 - PostgreSQL auth_db + Redis)
quarkus.application.name=auth-service
quarkus.http.port=8082

# Kết nối PostgreSQL (auth_db - auth_user/auth_pass)
quarkus.datasource.db-kind=postgresql
quarkus.datasource.username=${AUTH_DB_USER:auth_user}
quarkus.datasource.password=${AUTH_DB_PASSWORD:auth_pass}
quarkus.datasource.jdbc.url=${AUTH_DB_URL:jdbc:postgresql://localhost:5432/auth_db}
quarkus.datasource.devservices.enabled=false

# Hibernate ORM + Flyway (không để Hibernate tự sinh bảng theo chuẩn GEMINI.md)
quarkus.hibernate-orm.database.generation=none
quarkus.hibernate-orm.log.sql=true
quarkus.flyway.migrate-at-start=true

# Kết nối Redis (lưu phiên QR, token đặt lại mật khẩu)
quarkus.redis.hosts=${REDIS_URL:redis://localhost:6379}
quarkus.redis.devservices.enabled=false

# Cấu hình OpenAPI & Swagger UI
quarkus.smallrye-openapi.info-title=Auth Service API - Nhà Thuốc Trực Tuyến
quarkus.smallrye-openapi.info-version=1.0.0
quarkus.smallrye-openapi.info-description=API quản lý tài khoản người dùng, xác thực đăng ký/đăng nhập và cấp phát JWT token
quarkus.swagger-ui.always-include=true

# Ký JWT bằng khóa Private RSA (SmallRye JWT Build)
smallrye.jwt.sign.key.location=${JWT_PRIVATE_KEY_LOCATION:../keys/privateKey.pem}

# Xác thực JWT nội bộ cho API /me (SmallRye JWT)
mp.jwt.verify.issuer=${JWT_ISSUER:https://pharmacy.com/issuer}
mp.jwt.verify.publickey.location=${JWT_PUBLIC_KEY_LOCATION:../keys/publicKey.pem}
mp.jwt.verify.publickey.algorithm=RS256

# OpenTelemetry Tracing (Jaeger)
quarkus.otel.exporter.otlp.traces.endpoint=${OTEL_EXPORTER_OTLP_ENDPOINT:http://localhost:4317}
%test.quarkus.otel.sdk.disabled=true
