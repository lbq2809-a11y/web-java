# App Info
quarkus.application.name=auth-service
quarkus.http.port=8081

# Database Configuration (Docker MySQL Port 3307)
quarkus.datasource.db-kind=mysql
quarkus.datasource.username=root
quarkus.datasource.password=123456
quarkus.datasource.jdbc.url=jdbc:mysql://localhost:3307/auth_db?useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true
quarkus.datasource.devservices.enabled=false

# Hibernate ORM (Cú pháp chuẩn Quarkus mới)
quarkus.hibernate-orm.schema-generation.database.action=update
quarkus.hibernate-orm.log.sql=true

# External Service Client (Face Recognition Python)
quarkus.rest-client.face-recognition-service.url=http://localhost:5000

# JWT Configuration (Dùng chế độ tự động sinh key cho môi trường dev)
mp.jwt.verify.issuer=https://pharmacy.com/issuer
smallrye.jwt.sign.key.location=/dev-jwt-key.pem
smallrye.jwt.encrypt.key.location=/dev-jwt-key.pem