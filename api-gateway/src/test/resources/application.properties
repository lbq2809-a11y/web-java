# Cấu hình môi trường TEST cho api-gateway
quarkus.application.name=api-gateway-test
quarkus.http.test-port=0

# Tắt proactive auth khi test
quarkus.http.auth.proactive=false

# Cấu hình CORS khi test
quarkus.http.cors.enabled=true
quarkus.http.cors.origins=http://localhost:3000,http://localhost:5173,http://localhost:8080
quarkus.http.cors.methods=GET,POST,PUT,DELETE,OPTIONS,PATCH
quarkus.http.cors.headers=Authorization,Content-Type,Idempotency-Key,X-Correlation-Id,Accept
quarkus.http.cors.exposed-headers=X-Correlation-Id

# Backend mock URLs cho bộ test tích hợp
gateway.routes.auth.url=http://localhost:18082
gateway.routes.medicine.url=http://localhost:18081
gateway.routes.prescription.url=http://localhost:18083
gateway.routes.order.url=http://localhost:18084
gateway.routes.payment.url=http://localhost:18085
gateway.routes.notification.url=http://localhost:18086

# Danh sách route công khai cho môi trường TEST
gateway.security.public-routes=\
  POST:/api/v1/auth/login,\
  POST:/api/v1/auth/register,\
  POST:/api/v1/auth/refresh-token,\
  POST:/api/v1/auth/forgot-password,\
  POST:/api/v1/auth/reset-password,\
  POST:/api/v1/auth/face-login,\
  POST:/api/v1/auth/qr/session,\
  GET:/api/v1/auth/qr/session/*,\
  GET:/api/v1/medicines/**,\
  GET:/api/v1/categories/**,\
  GET:/api/v1/payments/vnpay/**,\
  POST:/api/v1/payments/vnpay/**,\
  GET:/q/**

# Timeout ngắn (400ms) để ca kiểm thử 504 chạy nhanh
gateway.http.client.timeout-ms=400

# Khóa RSA cho môi trường test
mp.jwt.verify.issuer=https://pharmacy.com/issuer
mp.jwt.verify.publickey.location=../keys/publicKey.pem
smallrye.jwt.sign.key.location=../keys/privateKey.pem

# Tắt Jaeger tracing khi test
quarkus.otel.sdk.disabled=true
