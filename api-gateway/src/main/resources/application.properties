quarkus.application.name=api-gateway
quarkus.http.port=8080

# REST Client trỏ tới từng service (dùng để định tuyến request)
quarkus.rest-client.auth-service.url=http://localhost:8081
quarkus.rest-client.medicine-service.url=http://localhost:8082
quarkus.rest-client.prescription-service.url=http://localhost:8083
quarkus.rest-client.order-service.url=http://localhost:8084
quarkus.rest-client.payment-service.url=http://localhost:8085
quarkus.rest-client.consultation-service.url=http://localhost:8086
quarkus.rest-client.recommendation-service.url=http://localhost:8087
quarkus.rest-client.notification-service.url=http://localhost:8088
quarkus.rest-client.inventory-service.url=http://localhost:8089

# CORS - cho phép frontend gọi vào (điều chỉnh port frontend nếu khác)
quarkus.http.cors=true
quarkus.http.cors.origins=http://localhost:3000