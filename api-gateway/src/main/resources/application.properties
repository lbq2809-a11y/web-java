# Cấu hình API Gateway (Cổng tiếp nhận tập trung 8080 - Không sử dụng Database)
quarkus.application.name=api-gateway
quarkus.http.port=8080

# Tắt proactive auth để Gateway tự kiểm tra JWT thủ công theo chuẩn ErrorResponse
quarkus.http.auth.proactive=false

# Cấu hình định tuyến Reverse Proxy tới từng backend microservice (Cổng theo GEMINI.md)
gateway.routes.auth.url=${AUTH_SERVICE_URL:http://localhost:8082}
gateway.routes.medicine.url=${MEDICINE_SERVICE_URL:http://localhost:8081}
gateway.routes.prescription.url=${PRESCRIPTION_SERVICE_URL:http://localhost:8083}
gateway.routes.order.url=${ORDER_SERVICE_URL:http://localhost:8084}
gateway.routes.payment.url=${PAYMENT_SERVICE_URL:http://localhost:8085}
gateway.routes.notification.url=${NOTIFICATION_SERVICE_URL:http://localhost:8086}

# Danh sách các route công khai (không cần JWT) theo định dạng METHOD:PATH_PATTERN
gateway.security.public-routes=\
  POST:/api/v1/auth/login,\
  POST:/api/v1/auth/register,\
  POST:/api/v1/auth/refresh-token,\
  POST:/api/v1/auth/forgot-password,\
  POST:/api/v1/auth/reset-password,\
  POST:/api/v1/auth/face-login,\
  POST:/api/v1/auth/qr/session,\
  GET:/api/v1/auth/qr/session/*,\
  GET:/api/v1/medicines/**,\
  GET:/api/v1/categories/**,\
  GET:/api/v1/payments/vnpay/**,\
  POST:/api/v1/payments/vnpay/**,\
  GET:/q/**

# Thời gian timeout khi kết nối tới backend (mili-giây)
gateway.http.client.timeout-ms=10000

# REST Client backwards compatibility
quarkus.rest-client.auth-service.url=${AUTH_SERVICE_URL:http://localhost:8082}
quarkus.rest-client.medicine-service.url=${MEDICINE_SERVICE_URL:http://localhost:8081}
quarkus.rest-client.prescription-service.url=${PRESCRIPTION_SERVICE_URL:http://localhost:8083}
quarkus.rest-client.order-service.url=${ORDER_SERVICE_URL:http://localhost:8084}
quarkus.rest-client.payment-service.url=${PAYMENT_SERVICE_URL:http://localhost:8085}
quarkus.rest-client.notification-service.url=${NOTIFICATION_SERVICE_URL:http://localhost:8086}

# Cấu hình CORS - cho phép Frontend gọi vào từ localhost dev ports
quarkus.http.cors.enabled=true
quarkus.http.cors.origins=${CORS_ORIGINS:http://localhost:3000,http://localhost:5173,http://localhost:8080}
quarkus.http.cors.methods=GET,POST,PUT,DELETE,OPTIONS,PATCH
quarkus.http.cors.headers=Authorization,Content-Type,Idempotency-Key,X-Correlation-Id,Accept
quarkus.http.cors.exposed-headers=X-Correlation-Id

# Xác thực JWT bằng SmallRye JWT (Public Key RSA dùng chung toàn hệ thống)
mp.jwt.verify.issuer=${JWT_ISSUER:https://pharmacy.com/issuer}
mp.jwt.verify.publickey.location=${JWT_PUBLIC_KEY_LOCATION:../keys/publicKey.pem}
mp.jwt.verify.publickey.algorithm=RS256

# Cấu hình OpenAPI & Swagger UI
quarkus.smallrye-openapi.info-title=API Gateway - Nhà Thuốc Trực Tuyến
quarkus.smallrye-openapi.info-version=1.0.0
quarkus.smallrye-openapi.info-description=Cổng tiếp nhận tập trung (Reverse Proxy) phân phối yêu cầu cho toàn bộ hệ sinh thái Microservices
quarkus.swagger-ui.always-include=true

# OpenTelemetry Tracing (Jaeger) - Tắt devservices/observability để không bắt buộc Docker Testcontainers
quarkus.observability.enabled=false
quarkus.otel.exporter.otlp.traces.endpoint=${OTEL_EXPORTER_OTLP_ENDPOINT:http://localhost:4317}
%test.quarkus.otel.sdk.disabled=true
