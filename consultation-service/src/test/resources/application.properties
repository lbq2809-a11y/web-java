# Cấu hình kiểm thử (profile test)
quarkus.http.test-port=0
quarkus.mongodb.database=consultation_test_db
quarkus.mongodb.devservices.enabled=false
quarkus.devservices.enabled=false

mp.jwt.verify.issuer=https://pharmacy.com/issuer
mp.jwt.verify.publickey.location=../keys/publicKey.pem
mp.jwt.verify.publickey.algorithm=RS256
smallrye.jwt.sign.key.location=../keys/privateKey.pem

consultation.rate-limit.max-requests=20
consultation.rate-limit.window-seconds=60
consultation.question.max-length=500
consultation.matcher.similarity-threshold=0.8

quarkus.otel.sdk.disabled=true

