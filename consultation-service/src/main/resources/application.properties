# Cấu hình Consultation Service (Cổng 8088 - MongoDB consultation_db)
quarkus.application.name=consultation-service
quarkus.http.port=8088

# Kết nối MongoDB (consultation_db)
quarkus.mongodb.connection-string=${MONGODB_URI:mongodb://localhost:27017}
quarkus.mongodb.database=${MONGODB_DATABASE:consultation_db}
quarkus.mongodb.devservices.enabled=false
quarkus.devservices.enabled=false

# Cấu hình xác thực JWT (SmallRye JWT) theo hợp đồng docs/JWT-CONTRACT.md
mp.jwt.verify.issuer=${JWT_ISSUER:https://pharmacy.com/issuer}
mp.jwt.verify.publickey.location=${JWT_PUBLIC_KEY_LOCATION:../keys/publicKey.pem}
mp.jwt.verify.publickey.algorithm=RS256

# Chỉ dùng khóa privateKey.pem ở môi trường dev/test để sinh token thử khi chưa chạy auth-service
%dev.smallrye.jwt.sign.key.location=${JWT_PRIVATE_KEY_LOCATION:../keys/privateKey.pem}
%test.smallrye.jwt.sign.key.location=${JWT_PRIVATE_KEY_LOCATION:../keys/privateKey.pem}

# REST Client gọi sang medicine-service
quarkus.rest-client.medicine-service.url=${MEDICINE_SERVICE_URL:http://localhost:8081}
quarkus.rest-client.medicine-service.connect-timeout=3000
quarkus.rest-client.medicine-service.read-timeout=5000

# Tham số nghiệp vụ tư vấn Tầng 1
consultation.rate-limit.max-requests=20
consultation.rate-limit.window-seconds=60
consultation.question.max-length=500
consultation.matcher.similarity-threshold=0.8

# Tham số nghiệp vụ tư vấn Tầng 2 (OpenAI-compatible AI & RAG)
consultation.ai.base-url=${CONSULTATION_AI_BASE_URL:http://localhost:11434/v1}
consultation.ai.api-key=${CONSULTATION_AI_API_KEY:none}
consultation.ai.chat-model=${CONSULTATION_AI_CHAT_MODEL:gpt-4o-mini}
consultation.ai.embedding-model=${CONSULTATION_AI_EMBEDDING_MODEL:text-embedding-3-small}
consultation.ai.timeout-seconds=${CONSULTATION_AI_TIMEOUT_SECONDS:10}
consultation.rag.top-k=4
consultation.rag.similarity-threshold=0.65

# Cấu hình OpenAPI & Swagger UI
quarkus.smallrye-openapi.info-title=Consultation Service API - Tư Vấn Thuốc Trực Tuyến
quarkus.smallrye-openapi.info-version=1.0.0
quarkus.smallrye-openapi.info-description=API tư vấn thuốc tự động (Tầng 1 Template & RAG + LLM), quản lý lịch sử hội thoại
quarkus.swagger-ui.always-include=true

# OpenTelemetry Tracing (Jaeger)
quarkus.otel.exporter.otlp.traces.endpoint=${OTEL_EXPORTER_OTLP_ENDPOINT:http://localhost:4317}
%test.quarkus.otel.sdk.disabled=true
