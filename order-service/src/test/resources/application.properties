# Cấu hình môi trường TEST cho order-service
quarkus.application.name=order-service-test
quarkus.http.test-port=0

# Kết nối CSDL PostgreSQL test (dùng container order_db đang chạy tại localhost:5432)
quarkus.datasource.db-kind=postgresql
quarkus.datasource.username=${ORDER_DB_USER:order_user}
quarkus.datasource.password=${ORDER_DB_PASSWORD:order_pass}
quarkus.datasource.jdbc.url=${ORDER_DB_URL:jdbc:postgresql://localhost:5432/order_db}
quarkus.datasource.devservices.enabled=false

# Hibernate ORM + Flyway
quarkus.hibernate-orm.database.generation=none
quarkus.hibernate-orm.log.sql=false
quarkus.flyway.migrate-at-start=true

# Kết nối Redis test (dùng container pharmacy-redis đang chạy tại localhost:6379)
quarkus.redis.hosts=${REDIS_URL:redis://localhost:6379}
quarkus.redis.devservices.enabled=false

# SmallRye Reactive Messaging (kênh in-memory cho test)
mp.messaging.outgoing.order-created.connector=smallrye-in-memory
mp.messaging.outgoing.order-status-changed.connector=smallrye-in-memory
mp.messaging.incoming.payment-completed-in.connector=smallrye-in-memory
mp.messaging.incoming.payment-failed-in.connector=smallrye-in-memory

# Cấu hình JWT cho test
mp.jwt.verify.issuer=https://pharmacy.com/issuer
mp.jwt.verify.publickey.location=../keys/publicKey.pem
smallrye.jwt.sign.key.location=../keys/privateKey.pem

# Tắt Jaeger tracing khi test
quarkus.otel.sdk.disabled=true
