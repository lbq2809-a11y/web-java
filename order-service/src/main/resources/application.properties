quarkus.application.name=order-service
quarkus.http.port=8084

quarkus.datasource.db-kind=mysql
quarkus.datasource.username=root
quarkus.datasource.password=123456
quarkus.datasource.jdbc.url=jdbc:mysql://localhost:3310/order_db

quarkus.hibernate-orm.database.generation=update
quarkus.hibernate-orm.log.sql=true

# Kafka - publish sự kiện khi đặt hàng thành công
kafka.bootstrap.servers=localhost:9092
mp.messaging.outgoing.order-events.connector=smallrye-kafka
mp.messaging.outgoing.order-events.topic=order-created
mp.messaging.outgoing.order-events.value.serializer=org.apache.kafka.common.serialization.StringSerializer

# Gọi sang các service khác
quarkus.rest-client.medicine-service.url=http://localhost:8082
quarkus.rest-client.prescription-service.url=http://localhost:8083