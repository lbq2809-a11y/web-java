# Cấu hình Order Service (Cổng 8084 - PostgreSQL order_db + Redis giỏ hàng)
quarkus.application.name=order-service
quarkus.http.port=8084

# Kết nối PostgreSQL (order_db - order_user/order_pass)
quarkus.datasource.db-kind=postgresql
quarkus.datasource.username=${ORDER_DB_USER:order_user}
quarkus.datasource.password=${ORDER_DB_PASSWORD:order_pass}
quarkus.datasource.jdbc.url=${ORDER_DB_URL:jdbc:postgresql://localhost:5432/order_db}
quarkus.datasource.devservices.enabled=false

# Hibernate ORM + Flyway (không để Hibernate tự sinh bảng)
quarkus.hibernate-orm.database.generation=none
quarkus.hibernate-orm.log.sql=true
quarkus.flyway.migrate-at-start=true

# Kết nối Redis (lưu giỏ hàng tạm thời)
quarkus.redis.hosts=${REDIS_URL:redis://localhost:6379}
quarkus.redis.devservices.enabled=false

# Kafka - publish/consume sự kiện đơn hàng và thanh toán
kafka.bootstrap.servers=${KAFKA_BOOTSTRAP_SERVERS:localhost:9092}
mp.messaging.outgoing.order-events.connector=smallrye-kafka
mp.messaging.outgoing.order-events.topic=order-created
mp.messaging.outgoing.order-events.value.serializer=org.apache.kafka.common.serialization.StringSerializer

# REST Client gọi sang Medicine Service (8081) và Prescription Service (8083)
quarkus.rest-client.medicine-service.url=${MEDICINE_SERVICE_URL:http://localhost:8081}
quarkus.rest-client.prescription-service.url=${PRESCRIPTION_SERVICE_URL:http://localhost:8083}

# Cấu hình xác thực JWT
mp.jwt.verify.issuer=${JWT_ISSUER:https://pharmacy.com/issuer}

# OpenTelemetry Tracing (Jaeger)
quarkus.otel.exporter.otlp.traces.endpoint=${OTEL_EXPORTER_OTLP_ENDPOINT:http://localhost:4317}