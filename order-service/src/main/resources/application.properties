# Cấu hình Order Service (Cổng 8084 - PostgreSQL order_db + Redis giỏ hàng)
quarkus.application.name=order-service
quarkus.http.port=8084

# Kết nối PostgreSQL (order_db - order_user/order_pass)
quarkus.datasource.db-kind=postgresql
quarkus.datasource.username=${ORDER_DB_USER:order_user}
quarkus.datasource.password=${ORDER_DB_PASSWORD:order_pass}
quarkus.datasource.jdbc.url=${ORDER_DB_URL:jdbc:postgresql://localhost:5432/order_db}
quarkus.datasource.devservices.enabled=false

# Hibernate ORM + Flyway (không để Hibernate tự sinh bảng)
quarkus.hibernate-orm.database.generation=none
quarkus.hibernate-orm.log.sql=true
quarkus.flyway.migrate-at-start=true

# Kết nối Redis (lưu giỏ hàng tạm thời)
quarkus.redis.hosts=${REDIS_URL:redis://localhost:6379}
quarkus.redis.devservices.enabled=false

# Cấu hình xác thực JWT (SmallRye JWT) theo hợp đồng docs/JWT-CONTRACT.md
mp.jwt.verify.issuer=${JWT_ISSUER:https://pharmacy.com/issuer}
mp.jwt.verify.publickey.location=${JWT_PUBLIC_KEY_LOCATION:../keys/publicKey.pem}
mp.jwt.verify.publickey.algorithm=RS256

# Khóa privateKey.pem ở môi trường dev/test để sinh token thử khi chưa có auth-service
%dev.smallrye.jwt.sign.key.location=${JWT_PRIVATE_KEY_LOCATION:../keys/privateKey.pem}
%test.smallrye.jwt.sign.key.location=${JWT_PRIVATE_KEY_LOCATION:../keys/privateKey.pem}

# Cấu hình OpenAPI & Swagger UI
quarkus.smallrye-openapi.info-title=Order Service API - Nhà Thuốc Trực Tuyến
quarkus.smallrye-openapi.info-version=1.0.0
quarkus.smallrye-openapi.info-description=API quản lý giỏ hàng Redis và xử lý đơn hàng, đặt hàng (Checkout), quản lý trạng thái
quarkus.swagger-ui.always-include=true

# Cấu hình Apache Kafka (localhost:9092)
kafka.bootstrap.servers=${KAFKA_BOOTSTRAP_SERVERS:localhost:9092}

# Outgoing: order.created
mp.messaging.outgoing.order-created.connector=smallrye-kafka
mp.messaging.outgoing.order-created.topic=order.created
mp.messaging.outgoing.order-created.key.serializer=org.apache.kafka.common.serialization.StringSerializer
mp.messaging.outgoing.order-created.value.serializer=org.apache.kafka.common.serialization.StringSerializer

# Outgoing: order.status-changed
mp.messaging.outgoing.order-status-changed.connector=smallrye-kafka
mp.messaging.outgoing.order-status-changed.topic=order.status-changed
mp.messaging.outgoing.order-status-changed.key.serializer=org.apache.kafka.common.serialization.StringSerializer
mp.messaging.outgoing.order-status-changed.value.serializer=org.apache.kafka.common.serialization.StringSerializer

# Incoming: payment.completed
mp.messaging.incoming.payment-completed-in.connector=smallrye-kafka
mp.messaging.incoming.payment-completed-in.topic=payment.completed
mp.messaging.incoming.payment-completed-in.value.deserializer=org.apache.kafka.common.serialization.StringDeserializer
mp.messaging.incoming.payment-completed-in.group.id=order-service-group
mp.messaging.incoming.payment-completed-in.auto.offset.reset=earliest

# Incoming: payment.failed
mp.messaging.incoming.payment-failed-in.connector=smallrye-kafka
mp.messaging.incoming.payment-failed-in.topic=payment.failed
mp.messaging.incoming.payment-failed-in.value.deserializer=org.apache.kafka.common.serialization.StringDeserializer
mp.messaging.incoming.payment-failed-in.group.id=order-service-group
mp.messaging.incoming.payment-failed-in.auto.offset.reset=earliest

# Profile Test: dùng connector in-memory
%test.mp.messaging.outgoing.order-created.connector=smallrye-in-memory
%test.mp.messaging.outgoing.order-status-changed.connector=smallrye-in-memory
%test.mp.messaging.incoming.payment-completed-in.connector=smallrye-in-memory
%test.mp.messaging.incoming.payment-failed-in.connector=smallrye-in-memory

# MicroProfile REST Client gọi sang Medicine Service (8081) và Prescription Service (8083)
quarkus.rest-client.medicine-service.url=${MEDICINE_SERVICE_URL:http://localhost:8081}
quarkus.rest-client.prescription-service.url=${PRESCRIPTION_SERVICE_URL:http://localhost:8083}

# OpenTelemetry Tracing (Jaeger)
quarkus.otel.exporter.otlp.traces.endpoint=${OTEL_EXPORTER_OTLP_ENDPOINT:http://localhost:4317}
%test.quarkus.otel.sdk.disabled=true
