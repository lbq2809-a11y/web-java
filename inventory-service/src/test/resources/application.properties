# ==============================================================================
# Cấu hình môi trường TEST cho inventory-service
# ==============================================================================
quarkus.application.name=inventory-service-test
quarkus.http.test-port=0

# H2 in-memory CSDL test (chế độ PostgreSQL mode) độc lập hoàn toàn
quarkus.datasource.db-kind=h2
quarkus.datasource.jdbc.url=jdbc:h2:mem:inventory_test;MODE=PostgreSQL;DATABASE_TO_LOWER=TRUE;DEFAULT_NULL_ORDERING=HIGH
quarkus.datasource.username=sa
quarkus.datasource.password=
quarkus.datasource.devservices.enabled=false
quarkus.flyway.migrate-at-start=true
quarkus.hibernate-orm.database.generation=none

# Tắt OpenTelemetry tracing khi test
quarkus.otel.sdk.disabled=true

# Cấu hình xác thực JWT trong môi trường test
mp.jwt.verify.issuer=https://pharmacy.com/issuer
mp.jwt.verify.publickey.location=../keys/publicKey.pem
smallrye.jwt.sign.key.location=../keys/privateKey.pem

# Giả lập SmallRye Reactive Messaging bằng in-memory connector khi test
mp.messaging.outgoing.inventory-reserved-out.connector=smallrye-in-memory
mp.messaging.outgoing.inventory-reservation-failed-out.connector=smallrye-in-memory
mp.messaging.outgoing.inventory-low-stock-out.connector=smallrye-in-memory
mp.messaging.outgoing.inventory-near-expiry-out.connector=smallrye-in-memory
mp.messaging.incoming.order-created-in.connector=smallrye-in-memory
mp.messaging.incoming.order-status-changed-in.connector=smallrye-in-memory

