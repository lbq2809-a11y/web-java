quarkus.application.name=auth-service
quarkus.http.port=8081

# Database
quarkus.datasource.db-kind=mysql
quarkus.datasource.username=root
quarkus.datasource.password=123456
quarkus.datasource.jdbc.url=jdbc:mysql://localhost:3307/auth_db

# Hibernate
quarkus.hibernate-orm.database.generation=update
quarkus.hibernate-orm.log.sql=true

# Gọi sang Face Recognition Service (Python)
quarkus.rest-client.face-recognition-service.url=http://localhost:5000

# JWT (dùng cho auth-service sinh token)
mp.jwt.verify.publickey.location=publicKey.pem
mp.jwt.verify.issuer=https://pharmacy.com/issuer
smallrye.jwt.sign.key.location=privateKey.pem