# Cấu hình Inventory Service (Cổng 8087 - PostgreSQL inventory_db)
quarkus.application.name=inventory-service
quarkus.http.port=8087

# Kết nối PostgreSQL (inventory_db - inventory_user/inventory_pass)
quarkus.datasource.db-kind=postgresql
quarkus.datasource.username=${INVENTORY_DB_USER:inventory_user}
quarkus.datasource.password=${INVENTORY_DB_PASSWORD:inventory_pass}
quarkus.datasource.jdbc.url=${INVENTORY_DB_URL:jdbc:postgresql://localhost:5432/inventory_db}
quarkus.datasource.devservices.enabled=false

# Hibernate ORM + Flyway (không để Hibernate tự sinh bảng)
quarkus.hibernate-orm.database.generation=none
quarkus.hibernate-orm.log.sql=true
quarkus.flyway.migrate-at-start=true

# Kafka
kafka.bootstrap.servers=${KAFKA_BOOTSTRAP_SERVERS:localhost:9092}

# Cấu hình xác thực JWT
mp.jwt.verify.issuer=${JWT_ISSUER:https://pharmacy.com/issuer}

# OpenTelemetry Tracing (Jaeger)
quarkus.otel.exporter.otlp.traces.endpoint=${OTEL_EXPORTER_OTLP_ENDPOINT:http://localhost:4317}