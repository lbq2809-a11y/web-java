# Cấu hình Inventory Service (Cổng 8087 - PostgreSQL inventory_db)
quarkus.application.name=inventory-service
quarkus.http.port=8087

# Kết nối PostgreSQL (inventory_db - inventory_user/inventory_pass)
quarkus.datasource.db-kind=postgresql
quarkus.datasource.username=${INVENTORY_DB_USER:inventory_user}
quarkus.datasource.password=${INVENTORY_DB_PASSWORD:inventory_pass}
quarkus.datasource.jdbc.url=${INVENTORY_DB_URL:jdbc:postgresql://localhost:5432/inventory_db}
quarkus.datasource.devservices.enabled=false

# Hibernate ORM + Flyway (không để Hibernate tự sinh bảng)
quarkus.hibernate-orm.database.generation=none
quarkus.hibernate-orm.log.sql=false
quarkus.flyway.migrate-at-start=true

# Cấu hình xác thực JWT (SmallRye JWT) theo hợp đồng docs/JWT-CONTRACT.md
mp.jwt.verify.issuer=${JWT_ISSUER:https://pharmacy.com/issuer}
mp.jwt.verify.publickey.location=${JWT_PUBLIC_KEY_LOCATION:../keys/publicKey.pem}
mp.jwt.verify.publickey.algorithm=RS256

# Khóa privateKey.pem ở môi trường dev để sinh token thử nghiệm
%dev.smallrye.jwt.sign.key.location=${JWT_PRIVATE_KEY_LOCATION:../keys/privateKey.pem}

# Cấu hình OpenAPI & Swagger UI
quarkus.smallrye-openapi.info-title=Inventory Service API - Nhà Thuốc Trực Tuyến
quarkus.smallrye-openapi.info-version=1.0.0
quarkus.smallrye-openapi.info-description=API quản lý lô thuốc, giữ hàng FEFO, biến động kho và cảnh báo tồn kho
quarkus.swagger-ui.always-include=true

# Cấu hình Apache Kafka (localhost:9092)
kafka.bootstrap.servers=${KAFKA_BOOTSTRAP_SERVERS:localhost:9092}

# Outgoing: inventory.reserved
mp.messaging.outgoing.inventory-reserved-out.connector=smallrye-kafka
mp.messaging.outgoing.inventory-reserved-out.topic=inventory.reserved
mp.messaging.outgoing.inventory-reserved-out.key.serializer=org.apache.kafka.common.serialization.StringSerializer
mp.messaging.outgoing.inventory-reserved-out.value.serializer=org.apache.kafka.common.serialization.StringSerializer

# Outgoing: inventory.reservation-failed
mp.messaging.outgoing.inventory-reservation-failed-out.connector=smallrye-kafka
mp.messaging.outgoing.inventory-reservation-failed-out.topic=inventory.reservation-failed
mp.messaging.outgoing.inventory-reservation-failed-out.key.serializer=org.apache.kafka.common.serialization.StringSerializer
mp.messaging.outgoing.inventory-reservation-failed-out.value.serializer=org.apache.kafka.common.serialization.StringSerializer

# Outgoing: inventory.low-stock
mp.messaging.outgoing.inventory-low-stock-out.connector=smallrye-kafka
mp.messaging.outgoing.inventory-low-stock-out.topic=inventory.low-stock
mp.messaging.outgoing.inventory-low-stock-out.key.serializer=org.apache.kafka.common.serialization.StringSerializer
mp.messaging.outgoing.inventory-low-stock-out.value.serializer=org.apache.kafka.common.serialization.StringSerializer

# Outgoing: inventory.near-expiry
mp.messaging.outgoing.inventory-near-expiry-out.connector=smallrye-kafka
mp.messaging.outgoing.inventory-near-expiry-out.topic=inventory.near-expiry
mp.messaging.outgoing.inventory-near-expiry-out.key.serializer=org.apache.kafka.common.serialization.StringSerializer
mp.messaging.outgoing.inventory-near-expiry-out.value.serializer=org.apache.kafka.common.serialization.StringSerializer

# Incoming: order.created
mp.messaging.incoming.order-created-in.connector=smallrye-kafka
mp.messaging.incoming.order-created-in.topic=order.created
mp.messaging.incoming.order-created-in.value.deserializer=org.apache.kafka.common.serialization.StringDeserializer
mp.messaging.incoming.order-created-in.group.id=inventory-service-group
mp.messaging.incoming.order-created-in.auto.offset.reset=earliest

# Incoming: order.status-changed
mp.messaging.incoming.order-status-changed-in.connector=smallrye-kafka
mp.messaging.incoming.order-status-changed-in.topic=order.status-changed
mp.messaging.incoming.order-status-changed-in.value.deserializer=org.apache.kafka.common.serialization.StringDeserializer
mp.messaging.incoming.order-status-changed-in.group.id=inventory-service-group
mp.messaging.incoming.order-status-changed-in.auto.offset.reset=earliest

# Cấu hình Outbox và Alert Scheduler
inventory.outbox.poll-interval=2s
inventory.alert.cron=0 0 1 * * ?
inventory.alert.near-expiry-days=90
inventory.alert.low-stock-threshold=20

# MicroProfile REST Client gọi sang Medicine Service (8081)
quarkus.rest-client.medicine-service.url=${MEDICINE_SERVICE_URL:http://localhost:8081}

# OpenTelemetry Tracing (Jaeger)
quarkus.otel.exporter.otlp.traces.endpoint=${OTEL_EXPORTER_OTLP_ENDPOINT:http://localhost:4317}
