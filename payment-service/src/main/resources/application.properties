# Cấu hình Payment Service (Cổng 8085 - PostgreSQL payment_db)
quarkus.application.name=payment-service
quarkus.http.port=8085

# Kết nối PostgreSQL (payment_db - payment_user/payment_pass)
quarkus.datasource.db-kind=postgresql
quarkus.datasource.username=${PAYMENT_DB_USER:payment_user}
quarkus.datasource.password=${PAYMENT_DB_PASSWORD:payment_pass}
quarkus.datasource.jdbc.url=${PAYMENT_DB_URL:jdbc:postgresql://localhost:5432/payment_db}
quarkus.datasource.devservices.enabled=false

# Hibernate ORM + Flyway (không để Hibernate tự sinh bảng)
quarkus.hibernate-orm.database.generation=none
quarkus.hibernate-orm.log.sql=true
quarkus.flyway.migrate-at-start=true

# Kafka - publish sự kiện khi thanh toán thành công
kafka.bootstrap.servers=${KAFKA_BOOTSTRAP_SERVERS:localhost:9092}

# Cấu hình VNPay Sandbox (đọc từ biến môi trường, không hard-code khóa bí mật)
vnpay.tmn-code=${VNPAY_TMN_CODE:sandbox_tmn_code}
vnpay.hash-secret=${VNPAY_HASH_SECRET:sandbox_hash_secret}
vnpay.payment-url=${VNPAY_PAYMENT_URL:https://sandbox.vnpayment.vn/paymentv2/vpcpay.html}
vnpay.return-url=${VNPAY_RETURN_URL:http://localhost:8085/api/v1/payments/vnpay-return}

# Cấu hình xác thực JWT
mp.jwt.verify.issuer=${JWT_ISSUER:https://pharmacy.com/issuer}
mp.jwt.verify.publickey.location=${JWT_PUBLIC_KEY_LOCATION:../keys/publicKey.pem}
mp.jwt.verify.publickey.algorithm=RS256

# OpenTelemetry Tracing (Jaeger)
quarkus.otel.exporter.otlp.traces.endpoint=${OTEL_EXPORTER_OTLP_ENDPOINT:http://localhost:4317}
# Order Service REST Client
quarkus.rest-client.order-service.url=${ORDER_SERVICE_URL:http://localhost:8084}

# Kafka Outbox publisher
mp.messaging.outgoing.payment-completed-out.connector=smallrye-kafka
mp.messaging.outgoing.payment-completed-out.topic=payment.completed
mp.messaging.outgoing.payment-completed-out.value.serializer=org.apache.kafka.common.serialization.StringSerializer

mp.messaging.outgoing.payment-failed-out.connector=smallrye-kafka
mp.messaging.outgoing.payment-failed-out.topic=payment.failed
mp.messaging.outgoing.payment-failed-out.value.serializer=org.apache.kafka.common.serialization.StringSerializer

# Hibernate Entity Package
quarkus.hibernate-orm.packages=com.pharmacy.payment.entity

quarkus.rest-client.order-service.scope=jakarta.inject.Singleton


# Kafka producer acknowledgement
mp.messaging.outgoing.payment-completed-out.acks=all
mp.messaging.outgoing.payment-failed-out.acks=all
