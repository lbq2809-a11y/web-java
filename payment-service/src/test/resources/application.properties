# Cấu hình môi trường TEST cho payment-service (dùng H2 PostgreSQL mode độc lập)
quarkus.application.name=payment-service-test
quarkus.http.test-port=0

quarkus.datasource.db-kind=h2
quarkus.datasource.jdbc.url=jdbc:h2:mem:payment_test;MODE=PostgreSQL;DATABASE_TO_LOWER=TRUE;DEFAULT_NULL_ORDERING=HIGH
quarkus.datasource.username=sa
quarkus.datasource.password=
quarkus.datasource.devservices.enabled=false

quarkus.flyway.migrate-at-start=false
quarkus.hibernate-orm.database.generation=drop-and-create
quarkus.hibernate-orm.log.sql=false

# SmallRye Reactive Messaging in-memory connectors cho môi trường test
mp.messaging.outgoing.payment-completed-out.connector=smallrye-in-memory
mp.messaging.outgoing.payment-failed-out.connector=smallrye-in-memory

# Cấu hình JWT test
mp.jwt.verify.issuer=https://pharmacy.com/issuer
mp.jwt.verify.publickey.location=../keys/publicKey.pem
mp.jwt.verify.publickey.algorithm=RS256
smallrye.jwt.sign.key.location=../keys/privateKey.pem

# Tắt Jaeger tracing khi test
quarkus.otel.sdk.disabled=true

# Cho phép @InjectMock trên REST client trong test (CDI normal scope)
quarkus.rest-client.order-service.scope=jakarta.enterprise.context.ApplicationScoped
