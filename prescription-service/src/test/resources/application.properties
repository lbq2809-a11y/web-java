# Cấu hình môi trường TEST cho prescription-service
quarkus.application.name=prescription-service-test

# Kết nối CSDL PostgreSQL test (dùng container prescription_db đang chạy tại localhost:5432)
quarkus.datasource.db-kind=postgresql
quarkus.datasource.username=${PRESCRIPTION_DB_USER:prescription_user}
quarkus.datasource.password=${PRESCRIPTION_DB_PASSWORD:prescription_pass}
quarkus.datasource.jdbc.url=${PRESCRIPTION_DB_URL:jdbc:postgresql://localhost:5432/prescription_db}
quarkus.datasource.devservices.enabled=false

# Hibernate ORM + Flyway
quarkus.hibernate-orm.database.generation=none
quarkus.hibernate-orm.log.sql=false
quarkus.flyway.migrate-at-start=true

# SmallRye Reactive Messaging (kênh in-memory cho test)
mp.messaging.outgoing.prescription-reviewed.connector=smallrye-in-memory

# Cấu hình JWT cho test
mp.jwt.verify.issuer=https://pharmacy.com/issuer
mp.jwt.verify.publickey.location=../keys/publicKey.pem
smallrye.jwt.sign.key.location=../keys/privateKey.pem

# Tắt Jaeger tracing khi test
quarkus.otel.sdk.disabled=true

