# Cấu hình Prescription Service (Cổng 8083 - PostgreSQL prescription_db + MinIO)
quarkus.application.name=prescription-service
quarkus.http.port=8083

# Kết nối PostgreSQL (prescription_db - prescription_user/prescription_pass)
quarkus.datasource.db-kind=postgresql
quarkus.datasource.username=${PRESCRIPTION_DB_USER:prescription_user}
quarkus.datasource.password=${PRESCRIPTION_DB_PASSWORD:prescription_pass}
quarkus.datasource.jdbc.url=${PRESCRIPTION_DB_URL:jdbc:postgresql://localhost:5432/prescription_db}
quarkus.datasource.devservices.enabled=false

# Hibernate ORM + Flyway (không để Hibernate tự sinh bảng)
quarkus.hibernate-orm.database.generation=none
quarkus.hibernate-orm.log.sql=true
quarkus.flyway.migrate-at-start=true

# Giới hạn kích thước tải lên (Multipart)
quarkus.http.limits.max-body-size=10M

# Cấu hình MinIO lưu trữ ảnh đơn thuốc (DB chỉ lưu đường dẫn)
minio.endpoint=${MINIO_ENDPOINT:http://localhost:9000}
minio.access-key=${MINIO_ACCESS_KEY:minioadmin}
minio.secret-key=${MINIO_SECRET_KEY:minioadmin}
minio.bucket=${MINIO_BUCKET:prescriptions}

# Cấu hình xác thực JWT (SmallRye JWT) theo hợp đồng docs/JWT-CONTRACT.md
mp.jwt.verify.issuer=${JWT_ISSUER:https://pharmacy.com/issuer}
mp.jwt.verify.publickey.location=${JWT_PUBLIC_KEY_LOCATION:../keys/publicKey.pem}
mp.jwt.verify.publickey.algorithm=RS256

# Chỉ dùng khóa privateKey.pem ở môi trường dev/test để sinh token thử khi chưa chạy auth-service
%dev.smallrye.jwt.sign.key.location=${JWT_PRIVATE_KEY_LOCATION:../keys/privateKey.pem}
%test.smallrye.jwt.sign.key.location=${JWT_PRIVATE_KEY_LOCATION:../keys/privateKey.pem}

# Cấu hình OpenAPI & Swagger UI
quarkus.smallrye-openapi.info-title=Prescription Service API - Nhà Thuốc Trực Tuyến
quarkus.smallrye-openapi.info-version=1.0.0
quarkus.smallrye-openapi.info-description=API quản lý tải ảnh đơn thuốc, duyệt/từ chối đơn và kiểm tra hiệu lực cho đơn hàng
quarkus.swagger-ui.always-include=true

# Cấu hình Kafka (Topic prescription.reviewed)
kafka.bootstrap.servers=${KAFKA_BOOTSTRAP_SERVERS:localhost:9092}
mp.messaging.outgoing.prescription-reviewed.connector=smallrye-kafka
mp.messaging.outgoing.prescription-reviewed.topic=prescription.reviewed
mp.messaging.outgoing.prescription-reviewed.key.serializer=org.apache.kafka.common.serialization.StringSerializer
mp.messaging.outgoing.prescription-reviewed.value.serializer=org.apache.kafka.common.serialization.StringSerializer

# Trong môi trường test: dùng connector in-memory để test chạy nhanh và độc lập
%test.mp.messaging.outgoing.prescription-reviewed.connector=smallrye-in-memory

# Gọi sang Medicine Service (cổng 8081) để kiểm tra thông tin thuốc khi cần
quarkus.rest-client.medicine-service.url=${MEDICINE_SERVICE_URL:http://localhost:8081}

# OpenTelemetry Tracing (Jaeger)
quarkus.otel.exporter.otlp.traces.endpoint=${OTEL_EXPORTER_OTLP_ENDPOINT:http://localhost:4317}
%test.quarkus.otel.sdk.disabled=true
