# Cấu hình Prescription Service (Cổng 8083 - PostgreSQL prescription_db + MinIO)
quarkus.application.name=prescription-service
quarkus.http.port=8083

# Kết nối PostgreSQL (prescription_db - prescription_user/prescription_pass)
quarkus.datasource.db-kind=postgresql
quarkus.datasource.username=${PRESCRIPTION_DB_USER:prescription_user}
quarkus.datasource.password=${PRESCRIPTION_DB_PASSWORD:prescription_pass}
quarkus.datasource.jdbc.url=${PRESCRIPTION_DB_URL:jdbc:postgresql://localhost:5432/prescription_db}
quarkus.datasource.devservices.enabled=false

# Hibernate ORM + Flyway (không để Hibernate tự sinh bảng)
quarkus.hibernate-orm.database.generation=none
quarkus.hibernate-orm.log.sql=true
quarkus.flyway.migrate-at-start=true

# Cấu hình MinIO lưu trữ ảnh đơn thuốc (DB chỉ lưu đường dẫn)
minio.endpoint=${MINIO_ENDPOINT:http://localhost:9000}
minio.access-key=${MINIO_ACCESS_KEY:minioadmin}
minio.secret-key=${MINIO_SECRET_KEY:minioadmin}
minio.bucket=${MINIO_BUCKET:prescriptions}

# Gọi sang Medicine Service (cổng 8081) để kiểm tra thuốc kê đơn (ETC)
quarkus.rest-client.medicine-service.url=${MEDICINE_SERVICE_URL:http://localhost:8081}

# Kafka
kafka.bootstrap.servers=${KAFKA_BOOTSTRAP_SERVERS:localhost:9092}

# Cấu hình xác thực JWT
mp.jwt.verify.issuer=${JWT_ISSUER:https://pharmacy.com/issuer}

# OpenTelemetry Tracing (Jaeger)
quarkus.otel.exporter.otlp.traces.endpoint=${OTEL_EXPORTER_OTLP_ENDPOINT:http://localhost:4317}