# Cấu hình môi trường TEST cho notification-service
quarkus.application.name=notification-service-test
quarkus.http.test-port=0

# Kết nối MongoDB test (database riêng biệt)
quarkus.mongodb.connection-string=${MONGODB_URI:mongodb://localhost:27017}
quarkus.mongodb.database=notification_test_db
quarkus.mongodb.devservices.enabled=false

# Giả lập Mailer khi chạy test
quarkus.mailer.mock=true

# Tắt Jaeger tracing khi test
quarkus.otel.sdk.disabled=true

# Cấu hình JWT test
mp.jwt.verify.issuer=https://pharmacy.com/issuer
mp.jwt.verify.publickey.location=../keys/publicKey.pem
mp.jwt.verify.publickey.algorithm=RS256
smallrye.jwt.sign.key.location=../keys/privateKey.pem

# SmallRye Reactive Messaging in-memory connectors cho môi trường test
mp.messaging.incoming.order-created.connector=smallrye-in-memory
mp.messaging.incoming.order-status-changed.connector=smallrye-in-memory
mp.messaging.incoming.payment-completed.connector=smallrye-in-memory
mp.messaging.incoming.payment-failed.connector=smallrye-in-memory
mp.messaging.incoming.prescription-reviewed.connector=smallrye-in-memory
mp.messaging.incoming.password-reset-requested.connector=smallrye-in-memory
mp.messaging.incoming.inventory-low-stock.connector=smallrye-in-memory
mp.messaging.incoming.inventory-near-expiry.connector=smallrye-in-memory
