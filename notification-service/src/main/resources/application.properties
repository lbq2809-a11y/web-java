# ===============================
# APPLICATION
# ===============================
quarkus.application.name=notification-service
quarkus.http.port=8086

# ===============================
# MONGODB
# ===============================
quarkus.mongodb.connection-string=${MONGODB_URI:mongodb://localhost:27017}
quarkus.mongodb.database=${MONGODB_DATABASE:notification_db}
quarkus.mongodb.devservices.enabled=false

# ===============================
# KAFKA
# ===============================
kafka.bootstrap.servers=${KAFKA_BOOTSTRAP_SERVERS:localhost:9092}

# Order created
mp.messaging.incoming.order-created.connector=smallrye-kafka
mp.messaging.incoming.order-created.topic=order.created
mp.messaging.incoming.order-created.value.deserializer=org.apache.kafka.common.serialization.StringDeserializer
mp.messaging.incoming.order-created.group.id=notification-order-created

# Order status changed
mp.messaging.incoming.order-status-changed.connector=smallrye-kafka
mp.messaging.incoming.order-status-changed.topic=order.status-changed
mp.messaging.incoming.order-status-changed.value.deserializer=org.apache.kafka.common.serialization.StringDeserializer
mp.messaging.incoming.order-status-changed.group.id=notification-order-status

# Payment completed
mp.messaging.incoming.payment-completed.connector=smallrye-kafka
mp.messaging.incoming.payment-completed.topic=payment.completed
mp.messaging.incoming.payment-completed.value.deserializer=org.apache.kafka.common.serialization.StringDeserializer
mp.messaging.incoming.payment-completed.group.id=notification-payment-completed

# Payment failed
mp.messaging.incoming.payment-failed.connector=smallrye-kafka
mp.messaging.incoming.payment-failed.topic=payment.failed
mp.messaging.incoming.payment-failed.value.deserializer=org.apache.kafka.common.serialization.StringDeserializer
mp.messaging.incoming.payment-failed.group.id=notification-payment-failed

# Prescription reviewed
mp.messaging.incoming.prescription-reviewed.connector=smallrye-kafka
mp.messaging.incoming.prescription-reviewed.topic=prescription.reviewed
mp.messaging.incoming.prescription-reviewed.value.deserializer=org.apache.kafka.common.serialization.StringDeserializer
mp.messaging.incoming.prescription-reviewed.group.id=notification-prescription-reviewed

# Password reset
mp.messaging.incoming.password-reset-requested.connector=smallrye-kafka
mp.messaging.incoming.password-reset-requested.topic=user.password-reset-requested
mp.messaging.incoming.password-reset-requested.value.deserializer=org.apache.kafka.common.serialization.StringDeserializer
mp.messaging.incoming.password-reset-requested.group.id=notification-password-reset

# Inventory low stock
mp.messaging.incoming.inventory-low-stock.connector=smallrye-kafka
mp.messaging.incoming.inventory-low-stock.topic=inventory.low-stock
mp.messaging.incoming.inventory-low-stock.value.deserializer=org.apache.kafka.common.serialization.StringDeserializer
mp.messaging.incoming.inventory-low-stock.group.id=notification-inventory-low-stock

# Inventory near expiry
mp.messaging.incoming.inventory-near-expiry.connector=smallrye-kafka
mp.messaging.incoming.inventory-near-expiry.topic=inventory.near-expiry
mp.messaging.incoming.inventory-near-expiry.value.deserializer=org.apache.kafka.common.serialization.StringDeserializer
mp.messaging.incoming.inventory-near-expiry.group.id=notification-inventory-near-expiry

# ===============================
# MAILER - MAILHOG
# ===============================
quarkus.mailer.from=${MAILER_FROM:noreply@pharmacy.local}
quarkus.mailer.host=${MAILER_HOST:localhost}
quarkus.mailer.port=${MAILER_PORT:1025}
quarkus.mailer.start-tls=DISABLED
quarkus.mailer.mock=false
quarkus.mailer.timeout=120S

# ===============================
# JWT
# ===============================
mp.jwt.verify.issuer=${JWT_ISSUER:https://pharmacy.com/issuer}
mp.jwt.verify.publickey.location=${JWT_PUBLIC_KEY_LOCATION:../keys/publicKey.pem}
mp.jwt.verify.publickey.algorithm=RS256

# ===============================
# OPENTELEMETRY
# ===============================
quarkus.otel.exporter.otlp.traces.endpoint=${OTEL_EXPORTER_OTLP_ENDPOINT:http://localhost:4317}

# ===============================
# NOTIFICATION
# ===============================
notification.staff-email=${NOTIFICATION_STAFF_EMAIL:staff@pharmacy.local}
# Password reset URL do Frontend cung cấp
notification.password-reset-url=${PASSWORD_RESET_URL:UNCONFIGURED}
