# Cấu hình Notification Service (Cổng 8086 - MongoDB notification_db + Kafka + MailHog + WebSocket)
quarkus.application.name=notification-service
quarkus.http.port=8086

# Kết nối MongoDB (notification_db)
quarkus.mongodb.connection-string=${MONGODB_URI:mongodb://localhost:27017}
quarkus.mongodb.database=${MONGODB_DATABASE:notification_db}
quarkus.mongodb.devservices.enabled=false

# Kafka - lắng nghe các sự kiện hệ thống để gửi thông báo
kafka.bootstrap.servers=${KAFKA_BOOTSTRAP_SERVERS:localhost:9092}
mp.messaging.incoming.order-events.connector=smallrye-kafka
mp.messaging.incoming.order-events.topic=order-created
mp.messaging.incoming.order-events.value.deserializer=org.apache.kafka.common.serialization.StringDeserializer

mp.messaging.incoming.payment-events.connector=smallrye-kafka
mp.messaging.incoming.payment-events.topic=payment-completed
mp.messaging.incoming.payment-events.value.deserializer=org.apache.kafka.common.serialization.StringDeserializer

# Cấu hình gửi Email qua MailHog SMTP (localhost:1025 - xem hộp thư tại http://localhost:8025)
quarkus.mailer.from=${MAILER_FROM:noreply@pharmacy.local}
quarkus.mailer.host=${MAILER_HOST:localhost}
quarkus.mailer.port=${MAILER_PORT:1025}
quarkus.mailer.start-tls=${MAILER_START_TLS:DISABLED}
quarkus.mailer.mock=false

# Cấu hình xác thực JWT
mp.jwt.verify.issuer=${JWT_ISSUER:https://pharmacy.com/issuer}

# OpenTelemetry Tracing (Jaeger)
quarkus.otel.exporter.otlp.traces.endpoint=${OTEL_EXPORTER_OTLP_ENDPOINT:http://localhost:4317}