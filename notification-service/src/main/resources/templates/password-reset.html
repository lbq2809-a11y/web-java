
<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <title>Khôi phục mật khẩu</title>
</head>
<body style="margin:0;padding:25px;background:#f4f6f9;font-family:Arial,sans-serif;">
    <div style="max-width:600px;margin:auto;background:white;border-radius:12px;overflow:hidden;">
        <div style="background:#2563eb;color:white;padding:25px;text-align:center;">
            <h1>PHARMACY</h1>
            <h2>Yêu cầu khôi phục mật khẩu</h2>
        </div>

        <div style="padding:30px;color:#333;">
            <h3>Xin chào {customerName}!</h3>

            <p>Chúng tôi nhận được yêu cầu khôi phục mật khẩu tài khoản của bạn.</p>

            <div style="text-align:center;padding:20px;">
                <a href="{resetUrl}"
                   style="background:#2563eb;color:white;padding:14px 25px;
                          text-decoration:none;border-radius:8px;display:inline-block;">
                    KHÔI PHỤC MẬT KHẨU
                </a>
            </div>

            <p>Liên kết có hiệu lực trong {expiresMinutes} phút.</p>

            <p>Nếu bạn không thực hiện yêu cầu này, hãy bỏ qua email.</p>

            <p>Trân trọng,<br><strong>Đội ngũ Pharmacy</strong></p>
        </div>
    </div>
</body>
</html>
