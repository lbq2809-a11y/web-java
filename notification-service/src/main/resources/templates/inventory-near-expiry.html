<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <title>Cảnh báo thuốc sắp hết hạn</title>
</head>
<body style="font-family:Arial,sans-serif;background:#f4f6f9;padding:25px;">
    <div style="max-width:600px;margin:auto;background:white;padding:30px;border-radius:12px;">
        <h2 style="color:#d97706;">CẢNH BÁO THUỐC SẮP HẾT HẠN</h2>
        <p>Kính gửi nhân viên Pharmacy,</p>
        <p>Thuốc <strong>{medicineName}</strong> có lô hàng sắp hết hạn.</p>
        <p>Mã lô: <strong>{batchNumber}</strong></p>
        <p>Ngày hết hạn: <strong>{expiryDate}</strong></p>
        <p>Số lượng trong lô: <strong>{quantity}</strong></p>
        <p>Số ngày còn lại: <strong>{daysLeft}</strong></p>
        <p>Vui lòng kiểm tra và xử lý lô hàng.</p>
        <p>Trân trọng,<br><strong>Hệ thống Pharmacy</strong></p>
    </div>
</body>
</html>
