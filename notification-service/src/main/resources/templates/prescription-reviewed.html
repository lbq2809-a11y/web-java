
<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <title>Kết quả duyệt đơn thuốc</title>
</head>
<body style="margin:0;padding:25px;background:#f4f6f9;font-family:Arial,sans-serif;">
    <div style="max-width:600px;margin:auto;background:white;border-radius:12px;overflow:hidden;">
        <div style="background:#0f766e;color:white;padding:25px;text-align:center;">
            <h1>PHARMACY</h1>
            <h2>Kết quả duyệt đơn thuốc</h2>
        </div>

        <div style="padding:30px;color:#333;">
            <h3>Xin chào {customerName}!</h3>

            <p>Đơn thuốc của bạn đã được dược sĩ kiểm tra.</p>

            <div style="background:#f0fdfa;padding:20px;border-radius:8px;">
                <p><strong>Mã đơn thuốc:</strong> {prescriptionId}</p>
                <p><strong>Kết quả:</strong> {decision}</p>
                <p><strong>Dược sĩ:</strong> {pharmacistName}</p>
                <p><strong>Lý do / ghi chú:</strong> {reason}</p>
            </div>

            <p>Vui lòng kiểm tra trạng thái đơn thuốc trên hệ thống.</p>
            <p>Trân trọng,<br><strong>Đội ngũ Pharmacy</strong></p>
        </div>
    </div>
</body>
</html>
