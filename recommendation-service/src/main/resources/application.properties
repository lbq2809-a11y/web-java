# Cấu hình Recommendation Service (Cổng 8089 - MongoDB recommendation_db + Kafka)
quarkus.application.name=recommendation-service
quarkus.http.port=8089

# Kết nối MongoDB (recommendation_db)
quarkus.mongodb.connection-string=${MONGODB_URI:mongodb://localhost:27017}
quarkus.mongodb.database=${MONGODB_DATABASE:recommendation_db}
quarkus.mongodb.devservices.enabled=false

# Kafka - lắng nghe sự kiện đặt hàng để cập nhật dữ liệu gợi ý
kafka.bootstrap.servers=${KAFKA_BOOTSTRAP_SERVERS:localhost:9092}
mp.messaging.incoming.order-events.connector=smallrye-kafka
mp.messaging.incoming.order-events.topic=order-created
mp.messaging.incoming.order-events.value.deserializer=org.apache.kafka.common.serialization.StringDeserializer

# Gọi sang Medicine Service (cổng 8081) để lấy thông tin thuốc
quarkus.rest-client.medicine-service.url=${MEDICINE_SERVICE_URL:http://localhost:8081}

# Cấu hình xác thực JWT
mp.jwt.verify.issuer=${JWT_ISSUER:https://pharmacy.com/issuer}

# OpenTelemetry Tracing (Jaeger)
quarkus.otel.exporter.otlp.traces.endpoint=${OTEL_EXPORTER_OTLP_ENDPOINT:http://localhost:4317}