quarkus.application.name=recommendation-service
quarkus.http.port=8087

quarkus.datasource.db-kind=mysql
quarkus.datasource.username=root
quarkus.datasource.password=123456
quarkus.datasource.jdbc.url=jdbc:mysql://localhost:3313/recommendation_db

quarkus.hibernate-orm.database.generation=update
quarkus.hibernate-orm.log.sql=true

# Kafka - lắng nghe sự kiện đặt hàng để cập nhật dữ liệu gợi ý
kafka.bootstrap.servers=localhost:9092
mp.messaging.incoming.order-events.connector=smallrye-kafka
mp.messaging.incoming.order-events.topic=order-created
mp.messaging.incoming.order-events.value.deserializer=org.apache.kafka.common.serialization.StringDeserializer

# Gọi sang Medicine Service để lấy thông tin thuốc
quarkus.rest-client.medicine-service.url=http://localhost:8082