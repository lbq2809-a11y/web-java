# Cấu hình Recommendation Service (Cổng 8089 - MongoDB recommendation_db + Kafka)
quarkus.application.name=recommendation-service
quarkus.http.port=8089

# Kết nối MongoDB (recommendation_db)
quarkus.mongodb.connection-string=${MONGODB_URI:mongodb://localhost:27017}
quarkus.mongodb.database=${MONGODB_DATABASE:recommendation_db}
quarkus.mongodb.devservices.enabled=false

# Cấu hình xác thực JWT (SmallRye JWT) theo hợp đồng docs/JWT-CONTRACT.md
mp.jwt.verify.issuer=${JWT_ISSUER:https://pharmacy.com/issuer}
mp.jwt.verify.publickey.location=${JWT_PUBLIC_KEY_LOCATION:../keys/publicKey.pem}
mp.jwt.verify.publickey.algorithm=RS256

# Khóa privateKey.pem ở môi trường dev để sinh token thử nghiệm
%dev.smallrye.jwt.sign.key.location=${JWT_PRIVATE_KEY_LOCATION:../keys/privateKey.pem}

# Cấu hình OpenAPI & Swagger UI
quarkus.smallrye-openapi.info-title=Recommendation Service API - Nhà Thuốc Trực Tuyến
quarkus.smallrye-openapi.info-version=1.0.0
quarkus.smallrye-openapi.info-description=Hệ thống gợi ý thuốc theo thống kê mua hàng (Frequently Bought Together, Personalized, Related)
quarkus.swagger-ui.always-include=true

# Kafka - lắng nghe sự kiện đặt hàng để cập nhật dữ liệu gợi ý
kafka.bootstrap.servers=${KAFKA_BOOTSTRAP_SERVERS:localhost:9092}

# Incoming: order.created
mp.messaging.incoming.order-created-in.connector=smallrye-kafka
mp.messaging.incoming.order-created-in.topic=order.created
mp.messaging.incoming.order-created-in.value.deserializer=org.apache.kafka.common.serialization.StringDeserializer
mp.messaging.incoming.order-created-in.group.id=recommendation-service-group
mp.messaging.incoming.order-created-in.auto.offset.reset=earliest

# Incoming: order.status-changed
mp.messaging.incoming.order-status-changed-in.connector=smallrye-kafka
mp.messaging.incoming.order-status-changed-in.topic=order.status-changed
mp.messaging.incoming.order-status-changed-in.value.deserializer=org.apache.kafka.common.serialization.StringDeserializer
mp.messaging.incoming.order-status-changed-in.group.id=recommendation-service-group
mp.messaging.incoming.order-status-changed-in.auto.offset.reset=earliest

# Gọi sang Medicine Service (cổng 8081) để lấy thông tin thuốc
quarkus.rest-client.medicine-service.url=${MEDICINE_SERVICE_URL:http://localhost:8081}

# OpenTelemetry Tracing (Jaeger)
quarkus.otel.exporter.otlp.traces.endpoint=${OTEL_EXPORTER_OTLP_ENDPOINT:http://localhost:4317}
