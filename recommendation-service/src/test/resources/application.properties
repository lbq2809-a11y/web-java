# ==============================================================================
# Cấu hình môi trường TEST cho recommendation-service
# ==============================================================================
quarkus.application.name=recommendation-service-test
quarkus.http.test-port=0

# Kết nối MongoDB test (database riêng biệt)
quarkus.mongodb.connection-string=${MONGODB_URI:mongodb://localhost:27017}
quarkus.mongodb.database=recommendation_test_db
quarkus.mongodb.devservices.enabled=false

# Tắt OpenTelemetry tracing khi test
quarkus.otel.sdk.disabled=true

# Cấu hình JWT test
mp.jwt.verify.issuer=https://pharmacy.com/issuer
mp.jwt.verify.publickey.location=../keys/publicKey.pem
mp.jwt.verify.publickey.algorithm=RS256
smallrye.jwt.sign.key.location=../keys/privateKey.pem

# SmallRye Reactive Messaging in-memory connectors cho test
mp.messaging.incoming.order-created-in.connector=smallrye-in-memory
mp.messaging.incoming.order-status-changed-in.connector=smallrye-in-memory

# Giảm thời gian trễ của Circuit Breaker trong môi trường test
com.pharmacy.recommendation.client.MedicineServiceClient/CircuitBreaker/delay=100
com.pharmacy.recommendation.client.MedicineServiceClient/Retry/maxRetries=0
